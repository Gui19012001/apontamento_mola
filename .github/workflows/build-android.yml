name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # REPOSITÓRIO
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # DEPENDÊNCIAS LINUX
      # MESMO PADRÃO DO APK QUE JÁ FUNCIONA
      # ==========================================================
      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip \
            zlib1g-dev

      # ==========================================================
      # GERAR CONFIGURAÇÃO DO APK
      # ==========================================================
      - name: Gerar teste.env
        run: |
          cat > teste.env <<EOF
          TOTVS_API_BASE=${{ secrets.TOTVS_API_BASE }}
          TOTVS_USERNAME=${{ secrets.TOTVS_USERNAME }}
          TOTVS_PASSWORD=${{ secrets.TOTVS_PASSWORD }}
          TOTVS_TIMEOUT=${{ secrets.TOTVS_TIMEOUT }}
          TOTVS_TENANT_ID=${{ secrets.TOTVS_TENANT_ID }}

          TOTVS_GET_ID_PATH=get_id
          TOTVS_GET_ID_MODE=param
          TOTVS_GET_ID_PARAM=op
          EOF

      # ==========================================================
      # BUILDOZER
      # EXATAMENTE O PADRÃO DO APK QUE JÁ FUNCIONA
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install "pip==24.0" wheel

          python -m pip install \
            "setuptools<75" \
            "cython==0.29.34" \
            "buildozer==1.5.0"

          pip --version
          python --version
          buildozer --version

      # ==========================================================
      # BUILD
      # ==========================================================
      - name: Build APK
        run: |
          buildozer android debug

      # ==========================================================
      # UPLOAD DO APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apontamento-roteiro-teste-apk
          path: bin/*.apk
          if-no-files-found: error
