name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Gerar teste.env
        run: |
          cat > teste.env <<EOF
          TOTVS_API_BASE=${{ secrets.TOTVS_API_BASE }}
          TOTVS_USERNAME=${{ secrets.TOTVS_USERNAME }}
          TOTVS_PASSWORD=${{ secrets.TOTVS_PASSWORD }}
          TOTVS_TIMEOUT=${{ secrets.TOTVS_TIMEOUT }}
          TOTVS_TENANT_ID=${{ secrets.TOTVS_TENANT_ID }}
          EOF

      - name: Install Buildozer
        run: |
          python -m pip install "pip==24.0" wheel
          python -m pip install \
            "setuptools<75" \
            "cython==0.29.34" \
            "buildozer==1.5.0"

          python --version
          python -m pip --version
          buildozer --version

      - name: Clean Android build
        run: |
          rm -rf .buildozer

      - name: Validate build configuration
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec

          grep -q '^requirements = python3,' buildozer.spec || {
            echo "ERRO: requirements deve usar python3 sem versao fixa"
            exit 1
          }

          grep -q '^android.ndk = 28c' buildozer.spec || {
            echo "ERRO: android.ndk deve estar fixado em 28c"
            exit 1
          }

          grep -q '^p4a.branch = develop' buildozer.spec || {
            echo "ERRO: p4a.branch incorreto"
            exit 1
          }

          grep -q '^p4a.commit = 5865575d81d53617784428ee29f57be2716311ea' buildozer.spec || {
            echo "ERRO: p4a.commit com correcao de wheels Android nao configurado"
            exit 1
          }

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apontamento-operacao-teste-apk
          path: bin/*.apk
          if-no-files-found: error
