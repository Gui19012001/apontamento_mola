name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Criar configuração do tablet
        shell: bash
        run: |
          cat > teste.env <<'ENVEOF'
          TOTVS_API_BASE=http://192.168.2.15:8195/rest/apontmod2
          TOTVS_USERNAME=${{ secrets.TOTVS_USERNAME }}
          TOTVS_PASSWORD=${{ secrets.TOTVS_PASSWORD }}
          TOTVS_TENANT_ID=${{ secrets.TOTVS_TENANT_ID }}
          TOTVS_TIMEOUT=100
          TOTVS_GET_ID_PATH=get_id
          TOTVS_GET_ID_MODE=param
          TOTVS_GET_ID_PARAM=op
          ENVEOF

      - name: Dependências Linux
        run: |
          sudo apt update
          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade "pip==24.0" setuptools wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33"

          python -m pip --version
          buildozer --version

      - name: Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache/pip
          rm -rf bin

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apontamento-roteiro-teste-apk
          path: bin/*.apk
          if-no-files-found: error
