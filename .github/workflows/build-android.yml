name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Gerar teste.env
        run: |
          cat > teste.env <<EOF
          TOTVS_API_BASE=${{ secrets.TOTVS_API_BASE }}
          TOTVS_USERNAME=${{ secrets.TOTVS_USERNAME }}
          TOTVS_PASSWORD=${{ secrets.TOTVS_PASSWORD }}
          TOTVS_TIMEOUT=${{ secrets.TOTVS_TIMEOUT }}
          TOTVS_TENANT_ID=${{ secrets.TOTVS_TENANT_ID }}

          TOTVS_GET_ID_PATH=get_id
          TOTVS_GET_ID_MODE=param
          TOTVS_GET_ID_PARAM=op
          EOF

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip==24.0"

          python -m pip install \
            "setuptools<75" \
            "wheel<1" \
            "cython==0.29.34" \
            "buildozer==1.5.0"

          echo "===== AMBIENTE ====="
          python --version
          python -m pip --version
          buildozer --version

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer

      - name: Validate build configuration
        run: |
          grep "^requirements" buildozer.spec
          grep "^p4a.branch" buildozer.spec

          if ! grep -q "python3==3.11.9" buildozer.spec; then
            echo "ERRO: Python Android não está travado em 3.11.9"
            exit 1
          fi

          if ! grep -q "p4a.branch" buildozer.spec; then
            echo "ERRO: python-for-android não está travado"
            exit 1
          fi

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apontamento-roteiro-teste-apk
          path: bin/*.apk
          if-no-files-found: error
